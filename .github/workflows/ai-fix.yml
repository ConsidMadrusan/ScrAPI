# Automated fixes for AI code review findings. This is development tooling
# only; the ScrAPI application itself uses no AI.
#
# Called by ai-review.yml after its three reviews. When they report findings at
# or above FIX_MIN_SEVERITY, Claude fixes them, the three reviews run again on
# the result, and this repeats up to five rounds (.github/ai-review/fix-loop.sh).
# The fixes are then opened as a pull request into the reviewed pull request's
# branch, with what changed and why. ai-review.yml does not review the commit
# that merges such a pull request.
#
# Needs the repository setting "Allow GitHub Actions to create and approve pull
# requests" and the secret ANTHROPIC_API_KEY.
name: AI review fixes

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
      base_ref:
        type: string
        required: true
      head_ref:
        type: string
        required: true
      head_sha:
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: ai-fix-${{ inputs.pr_number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      BASE_REF: ${{ inputs.base_ref }}
      HEAD_REF: ${{ inputs.head_ref }}
      HEAD_SHA: ${{ inputs.head_sha }}
      MAX_ITERATIONS: "5"
      # Findings below this severity are left in the review comments only.
      FIX_MIN_SEVERITY: medium
      CLAUDE_CODE_VERSION: 2.1.296
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: Download review results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ai-review-*
          path: ${{ runner.temp }}/initial-reviews
          merge-multiple: true

      - name: Collect findings to fix
        id: findings
        run: |
          export WORK_DIR="${RUNNER_TEMP}/ai-fix"
          echo "WORK_DIR=${WORK_DIR}" >> "$GITHUB_ENV"
          count="$(bash .github/ai-review/fix-loop.sh collect "${RUNNER_TEMP}/initial-reviews" "${WORK_DIR}/initial-findings.json")"
          echo "Findings at or above ${FIX_MIN_SEVERITY}: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.findings.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies and Claude Code
        if: steps.findings.outputs.count != '0'
        run: |
          npm ci
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Fix and review again
        id: loop
        if: steps.findings.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash .github/ai-review/fix-loop.sh run "${WORK_DIR}/initial-findings.json"

      - name: Open or update the fix pull request
        if: steps.loop.outputs.changed == 'true'
        env:
          CHECK_PASSED: ${{ steps.loop.outputs.check_passed }}
        run: |
          branch="ai-fix/pr-${PR_NUMBER}-${HEAD_SHA:0:7}"
          git push --force origin "HEAD:refs/heads/${branch}"

          title="AI review fixes for #${PR_NUMBER}"
          existing="$(gh pr list --repo "${REPO}" --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --repo "${REPO}" --body-file "${WORK_DIR}/pr-body.md" > /dev/null
            fix_pr="${existing}"
          else
            draft=()
            # A fix that breaks npm run check is opened as a draft.
            [ "${CHECK_PASSED}" = true ] || draft=(--draft)
            if ! url="$(gh pr create --repo "${REPO}" --base "${HEAD_REF}" --head "${branch}" \
              --title "${title}" --body-file "${WORK_DIR}/pr-body.md" "${draft[@]}")"; then
              # Usually the setting "Allow GitHub Actions to create and approve
              # pull requests" is off. The branch is pushed, so link to it.
              echo "::error::Could not open the fix pull request. Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
              compare_url="${GITHUB_SERVER_URL}/${REPO}/compare/${HEAD_REF}...${branch}?expand=1"
              marker="<!-- ai-fix -->"
              {
                echo "${marker}"
                echo "### AI review fixes"
                echo
                echo "Fixes are on \`${branch}\`, but GitHub Actions may not open pull requests here. [Open it yourself](${compare_url}) with the description below, or enable *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*."
                echo
                echo "<details><summary>Description</summary>"
                echo
                cat "${WORK_DIR}/pr-body.md"
                echo
                echo "</details>"
              } > "${WORK_DIR}/comment.md"
              bash .github/ai-review/upsert-comment.sh "${marker}" "${WORK_DIR}/comment.md"
              exit 1
            fi
            fix_pr="${url##*/}"
          fi

          # Close fix pull requests for older commits of the same pull request.
          gh pr list --repo "${REPO}" --base "${HEAD_REF}" --state open --json number,headRefName \
            --jq ".[] | select((.headRefName | startswith(\"ai-fix/pr-${PR_NUMBER}-\")) and .number != ${fix_pr}) | .number" \
            | while read -r old; do
                gh pr close "${old}" --repo "${REPO}" --delete-branch --comment "Superseded by #${fix_pr}." > /dev/null
              done

          marker="<!-- ai-fix -->"
          {
            echo "${marker}"
            echo "### AI review fixes"
            echo
            echo "Fixes for commit ${HEAD_SHA:0:7}: #${fix_pr}"
          } > "${WORK_DIR}/comment.md"
          bash .github/ai-review/upsert-comment.sh "${marker}" "${WORK_DIR}/comment.md"

      - name: Report when no fix pull request was opened
        if: steps.loop.outcome == 'success' && steps.loop.outputs.changed != 'true'
        run: |
          marker="<!-- ai-fix -->"
          {
            echo "${marker}"
            echo "### AI review fixes"
            echo
            echo "No automatic fixes for commit ${HEAD_SHA:0:7}; the findings above need a person."
            echo
            sed -n '/^### Not fixed/,$p' "${WORK_DIR}/pr-body.md"
          } > "${WORK_DIR}/comment.md"
          bash .github/ai-review/upsert-comment.sh "${marker}" "${WORK_DIR}/comment.md"
